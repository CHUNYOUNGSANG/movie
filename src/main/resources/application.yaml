spring:
  application:
    name: moviebot
  # 로컬: ./gradlew bootTestRun → Testcontainers 가 MySQL 컨테이너를 띄우고 접속 정보를 자동 주입
  # 운영: docker-compose 의 SPRING_DATASOURCE_* 환경변수로 덮어씀
  # 아래 기본값은 docker compose 의 db(3306)에 bootRun 으로 직접 붙을 때 사용 (.env 의 DB_USER / DB_PASSWORD)
  datasource:
    url: jdbc:mysql://localhost:3306/moviebotdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USER:moviebot}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50      # INSERT/UPDATE 를 묶어서 실행 (IDENTITY PK 엔티티는 제외됨)
        order_inserts: true
        order_updates: true
  task:
    scheduling:
      pool:
        size: 5

# ── 텔레그램 봇 ─────────────────────────────────────────────
# @BotFather → /newbot 으로 토큰 발급 후 TELEGRAM_BOT_TOKEN 환경변수로 주입
# docker-compose는 .env에서 자동 주입. 로컬 직접 실행/테스트는 spring-dotenv가 .env를 읽어서 주입
# 구독자는 봇에 /start 메시지를 보내 자동 등록됩니다
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}

# ── 폴링 주기 (기본: 5분마다) ────────────────────────────────
movie:
  check:
    cron: "0 */5 * * * *"

# ── 알림 Outbox ─────────────────────────────────────────────
notification:
  outbox:
    relay-delay-ms: 10000   # 미발송/재시도 대상 확인 주기
    base-delay-ms: 30000    # 재시도 대기 시작값 (30초 → 1분 → 2분 → 4분, 지수 백오프)
    max-attempts: 5         # 최대 발송 시도 횟수 (초과 시 DEAD)

# ── 로그 ────────────────────────────────────────────────────
logging:
  level:
    com.example.moviebot: INFO