spring:
  application:
    name: moviebot
  # 로컬: ./gradlew bootTestRun → Testcontainers 가 MySQL 컨테이너를 띄우고 접속 정보를 자동 주입
  # 운영: docker-compose 의 SPRING_DATASOURCE_* 환경변수로 덮어씀
  # 아래 기본값은 docker compose 의 db(3306)에 bootRun 으로 직접 붙을 때 사용 (.env 의 DB_USER / DB_PASSWORD)
  datasource:
    url: jdbc:mysql://localhost:3306/moviebotdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USER:moviebot}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50      # INSERT/UPDATE 를 묶어서 실행 (IDENTITY PK 엔티티는 제외됨)
        order_inserts: true
        order_updates: true
  task:
    scheduling:
      pool:
        size: 5
  # 종료 시 스케줄러·크롤링 스레드풀은 Spring 이 일시 정지하고 실행 중인 작업(크롤링 주기, 크롤링)이 끝나기를 기다린다 (Spring 6.1+).
  # spring.task.scheduling.shutdown.await-termination 을 켜면 일시 정지된 스레드를 한 번 더 기다려 매 종료가 40초씩 늘어나므로 쓰지 않는다
  lifecycle:
    timeout-per-shutdown-phase: 40s   # 종료 단계별 최대 대기 (docker-compose stop_grace_period 60s 보다 짧게)

# ── 텔레그램 봇 ─────────────────────────────────────────────
# @BotFather → /newbot 으로 토큰 발급 후 TELEGRAM_BOT_TOKEN 환경변수로 주입
# docker-compose는 .env에서 자동 주입. 로컬 직접 실행/테스트는 spring-dotenv가 .env를 읽어서 주입
# 구독자는 봇에 /start 메시지를 보내 자동 등록됩니다
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
  rate-limit:
    per-second: 25   # 전역 발송 제한(초당 약 30건)보다 여유 있게. 서버 1대 기준

# ── API 인증 ────────────────────────────────────────────────
# 텔레그램 로그인 위젯 정보(서명)를 검증하고 JWT(HS256) 를 발급한다. 봇 사용에는 필요 없음
auth:
  telegram:
    max-age: PT24H        # 텔레그램 로그인 정보(auth_date)의 유효 기간. 지나면 다시 로그인
  jwt:
    secret: ${AUTH_JWT_SECRET:}   # 32바이트 이상. 비우면 시작할 때마다 임의 생성(재시작 시 토큰 무효, 서버 1대 전용)
    ttl: PT1H             # 발급한 토큰의 유효 기간

# ── 폴링 주기 (기본: 5분마다) ────────────────────────────────
movie:
  check:
    cron: "0 */5 * * * *"
  crawl:
    cycle-timeout: PT8M   # 주기 전체 제한 시간 (ShedLock lockAtMostFor 10분보다 짧게). 넘기면 남은 크롤링은 다음 주기로

# ── 알림 (신청 만료, Outbox) ─────────────────────────────────
notification:
  # 상영일이 지나도록 예매가 열리지 않은 신청을 만료 처리하고 사용자에게 한 번 안내 (서울 기준 매일 00:10)
  expiry:
    cron: "0 10 0 * * *"
  outbox:
    relay-delay-ms: 10000   # 미발송/재시도 대상 확인 주기
    base-delay-ms: 30000    # 재시도 대기 시작값 (30초 → 1분 → 2분 → 4분, 지수 백오프)
    max-attempts: 5         # 최대 발송 시도 횟수 (초과 시 DEAD)

# ── 종료 (배포, docker stop) ─────────────────────────────────
# 진행 중인 HTTP 요청과 스케줄 작업(크롤링 주기)이 끝날 때까지 기다린 뒤 종료 (단계별 최대 대기는 spring.lifecycle).
# 크롤링 주기는 종료 신호를 받으면 남은 크롤링을 시작하지 않고 곧바로 끝나므로(BookingCheckService.onShutdown)
# 대기 시간은 실행 중인 크롤링 하나(요청 제한 시간) 정도
server:
  shutdown: graceful

# ── 데이터 보관 ──────────────────────────────────────────────
# 보관 기간이 지난 데이터를 매일 새벽 배치로 나눠 삭제 (DataRetentionService)
retention:
  cron: "0 30 3 * * *"
  schedule-days: 7          # 상영 일정: 상영일 + 7일 후 삭제
  subscription-days: 90     # 끝난 신청(매칭·만료)과 그 Outbox·발송 이력: 상영일 + 90일 후 삭제
  batch-size: 1000          # 한 트랜잭션에 지우는 최대 행 수

# ── 모니터링 (Actuator) ──────────────────────────────────────
# 관리용 엔드포인트는 서비스 포트(8080)와 분리된 8081 에서만 연다.
# docker-compose 는 8081 을 호스트에 공개하지 않으므로 같은 네트워크의 Prometheus 등에서만 접근 가능
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never     # 외부에 DB 등 내부 구성 정보를 노출하지 않음
  metrics:
    tags:
      application: ${spring.application.name}

# ── 로그 ────────────────────────────────────────────────────
logging:
  level:
    io.github.chunyoungsang.moviebot: INFO