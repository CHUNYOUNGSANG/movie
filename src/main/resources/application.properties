spring.application.name=moviebot

# ── 텔레그램 봇 ─────────────────────────────────────────────
# @BotFather → /newbot 으로 토큰 발급 후 아래에 입력
# 구독자는 봇에 /start 메시지를 보내 자동 등록됩니다
telegram.bot.token=8704943180:AAHchiXotNRXWJT8LuHP46RAHKyE2b8YhJo

# ── H2 인메모리 DB ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:moviebotdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── 폴링 주기 (기본: 5분마다) ────────────────────────────────
movie.check.cron=0 */5 * * * *

# ── 로그 ────────────────────────────────────────────────────
logging.level.com.example.moviebot=INFO