spring.application.name=moviebot

# ── 텔레그램 봇 ─────────────────────────────────────────────
# @BotFather → /newbot 으로 토큰 발급 후 아래에 입력
# 구독자는 봇에 /start 메시지를 보내 자동 등록됩니다
telegram.bot.token=8704943180:AAHchiXotNRXWJT8LuHP46RAHKyE2b8YhJo

# ── H2 인메모리 DB ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:moviebotdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── 폴링 주기 (기본: 5분마다) ────────────────────────────────
movie.check.cron=0 */5 * * * *

# ── 스케줄러 스레드풀 ─────────────────────────────────────────
# 기본값 1 → 여러 스케줄 작업이 겹쳐도 블로킹 없음
spring.task.scheduling.pool.size=5

# ── HikariCP 커넥션풀 ─────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── 로그 ────────────────────────────────────────────────────
logging.level.com.example.moviebot=INFO