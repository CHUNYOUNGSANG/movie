name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 실제 토큰은 쓰지 않는다. YOUR_ 로 시작하면 텔레그램 폴링을 건너뛴다.
      TELEGRAM_BOT_TOKEN: YOUR_CI_DUMMY
      # 테스트는 크롤러를 mock 으로 대체하므로 Chromium 다운로드(약 150MB)를 건너뛴다.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5   # Gradle 의존성/빌드 캐시

      # 통합 테스트는 Testcontainers 로 MySQL 8.4 컨테이너를 띄운다 (러너에 Docker 기본 제공)
      - name: Test
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

      # JaCoCo 커버리지를 실행 요약(Job summary)에 남기고 HTML 리포트를 보관
      - name: Coverage summary
        if: always()
        run: |
          f=build/reports/jacoco/test/jacocoTestReport.xml
          [ -f "$f" ] || exit 0
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          rows = {c.get('type'): c for c in root.findall('counter')}
          print('### 테스트 커버리지 (JaCoCo)')
          print('| 기준 | 커버리지 |')
          print('|---|---|')
          for t, name in [('LINE', '라인'), ('BRANCH', '분기'), ('METHOD', '메서드')]:
              c = rows[t]; covered, missed = int(c.get('covered')), int(c.get('missed'))
              print(f'| {name} | {covered / (covered + missed) * 100:.1f}% ({covered}/{covered + missed}) |')
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html
          retention-days: 7

  # Dockerfile 이 깨지지 않았는지 이미지 빌드만 확인 (푸시하지 않음)
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: moviebot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
