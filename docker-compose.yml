services:

  # ── MySQL (영구 저장소) ──────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: moviebot-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: moviebotdb
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # 이 컴퓨터(서버)에서만 접속. 0.0.0.0 이면 같은 네트워크의 다른 기기도 DB 에 붙는다
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 앱 ───────────────────────────────────────────
  app:
    build: .
    container_name: moviebot-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/moviebotdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      MOVIE_CHECK_CRON: ${MOVIE_CHECK_CRON:-0 */5 * * * *}
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      TZ: Asia/Seoul
    volumes:
      - playwright-browsers:/playwright-browsers
    ports:
      - "127.0.0.1:8080:8080"   # REST API 도 이 컴퓨터에서만. 밖에 열려면 앞단에 HTTPS 리버스 프록시를 둔다
      # 8081(관리용 /actuator)은 일부러 공개하지 않음: 같은 docker 네트워크에서 http://app:8081/actuator/prometheus 로 수집
    restart: unless-stopped
    # 종료 시 진행 중인 크롤링 주기가 정리되도록 SIGTERM 후 강제 종료까지 기다리는 시간 (기본 10초)
    stop_grace_period: 60s

  # ── 모니터링 (Prometheus + Grafana) ──────────────────────────
  # 두 포트 모두 127.0.0.1 에만 연다. 서버에서는 SSH 터널로 접속한다 (ssh -L 3000:localhost:3000 -L 9090:localhost:9090 사용자@서버)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: moviebot-prometheus
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: moviebot-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 를 .env 에 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Seoul
      # 알림 규칙(provisioning/alerting)이 텔레그램으로 보낼 때 쓴다
      GRAFANA_ALERT_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN 을 .env 에 설정하세요}
      GRAFANA_ALERT_TELEGRAM_CHAT_ID: ${GRAFANA_ALERT_TELEGRAM_CHAT_ID:?GRAFANA_ALERT_TELEGRAM_CHAT_ID(알림 받을 텔레그램 chat id)를 .env 에 설정하세요}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  mysql-data:
  playwright-browsers:
  prometheus-data:
  grafana-data: