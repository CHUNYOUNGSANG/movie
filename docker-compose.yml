services:

  # ── MySQL (영구 저장소) ──────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: moviebot-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: moviebotdb
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 앱 ───────────────────────────────────────────
  app:
    build: .
    container_name: moviebot-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/moviebotdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MOVIE_CHECK_CRON: ${MOVIE_CHECK_CRON:-0 */5 * * * *}
      PLAYWRIGHT_BROWSERS_PATH: /playwright-browsers
      TZ: Asia/Seoul
    volumes:
      - playwright-browsers:/playwright-browsers
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
  playwright-browsers: