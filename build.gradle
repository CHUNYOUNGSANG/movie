plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'moviebot'

// 기본 패키지에 있는 main class를 명시
springBoot {
    mainClass = 'MovieBotApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.1")
}

dependencies {
    // .env 파일을 Spring Environment에 자동 로드 (로컬 직접 실행 시 docker-compose와 동일하게 .env 사용)
    implementation 'me.paulschwarz:spring-dotenv:5.1.0'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // JPA + H2 (로컬/테스트) + MySQL (운영)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // DB 마이그레이션 (ddl-auto 대신 명시적 스키마 버전 관리)
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // 다중 서버에서 스케줄 작업을 한 대에서만 실행 (DB 기반 분산 락)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Playwright (헤드리스 브라우저 - Cloudflare 우회)
    implementation 'com.microsoft.playwright:playwright:1.45.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
