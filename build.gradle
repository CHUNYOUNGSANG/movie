plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.github.chunyoungsang'
version = '0.0.1-SNAPSHOT'
description = 'moviebot'

// 기본 패키지에 있는 main class를 명시
springBoot {
    mainClass = 'io.github.chunyoungsang.moviebot.MovieBotApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.1")
}

dependencies {
    // .env 파일을 Spring Environment에 자동 로드 (로컬 직접 실행 시 docker-compose와 동일하게 .env 사용)
    implementation 'me.paulschwarz:spring-dotenv:5.1.0'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // 모니터링: 헬스 체크 + Prometheus 형식 지표 (/actuator/health, /actuator/prometheus)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // JPA + MySQL (운영 / 로컬·테스트는 Testcontainers 로 같은 MySQL 8.4 사용)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // DB 마이그레이션 (ddl-auto 대신 명시적 스키마 버전 관리)
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // 다중 서버에서 스케줄 작업을 한 대에서만 실행 (DB 기반 분산 락)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

    // Playwright (헤드리스 브라우저 - Cloudflare 우회)
    implementation 'com.microsoft.playwright:playwright:1.45.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // 통합 테스트를 운영과 같은 MySQL 8.4 컨테이너에서 실행
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    // 패키지 의존 규칙(순환 금지, 의존 방향)을 테스트로 고정
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
